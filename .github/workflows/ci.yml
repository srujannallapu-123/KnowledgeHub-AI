name: KnowledgeHub-AI CI

on:
  push:
    branches:
      - main
      - feature/express-postgres-backend

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js types
        run: npx next typegen

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run automated tests
        run: npm run test:ci

      - name: Production dependency security check
        run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend checks and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Production dependency security check
        run: npm audit --omit=dev --audit-level=high